<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Science Lab • Edu Ezziymy</title><style>
*{box-sizing:border-box}body{margin:0;font:16px Arial;background:#edf4f6;color:#173b4b}header{background:#12384b;color:white;padding:26px}main{max-width:960px;margin:auto;padding:18px}button,select{padding:12px;border-radius:12px;border:1px solid #b4d0d6;background:white;color:#12384b}button.active{background:#098681;color:white}.tabs{display:flex;gap:8px;flex-wrap:wrap}.panel{background:white;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 6px 20px #12384b0a}canvas{display:block;width:100%;height:300px;background:#f5f9fb;border-radius:16px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}label{display:block}input{width:100%;accent-color:#098681}.metric{font-size:24px;font-weight:bold;color:#098681;padding:16px 0}footer{padding:24px;text-align:center;color:#5c7782}</style></head><body><header><button id="language">العربية / Français</button><h1 id="title"></h1><p id="subtitle"></p></header><main><div class="tabs" id="tabs"></div><div class="panel"><canvas id="plot"></canvas><div class="metric" id="metric"></div><div class="controls" id="controls"></div><p id="formula"></p></div><div class="panel"><h2 id="observe"></h2><p id="task"></p><button id="pause"></button><button id="reset"></button></div></main><footer>Mohamed Ez-ziymy • Edu Ezziymy</footer><script>
const translations={fr:{title:'Laboratoire interactif',subtitle:'Prévoir • Manipuler • Expliquer',tabs:['Loi d’Ohm','Énergies mécaniques','Onde progressive'],observe:'À vous de prévoir',tasks:['À résistance constante, que devient l’intensité si la tension double ? Vérifiez puis expliquez avec I = U/R.','Doublez la vitesse. Par quel facteur l’énergie cinétique change-t-elle ? Comparez aussi une variation de hauteur.','Augmentez la fréquence en gardant la célérité fixe. Que devient la longueur d’onde ? Le milieu oscille sur place : il n’avance pas avec l’onde.'],pause:'Pause / Reprendre',reset:'Réinitialiser',labels:['Tension U (V)','Résistance R (Ω)','Masse m (kg)','Vitesse v (m/s)','Hauteur h (m)','Amplitude A (m)','Fréquence f (Hz)','Célérité c (m/s)']},ar:{title:'مختبر العلوم التفاعلي',subtitle:'توقع • جرّب • فسّر',tabs:['قانون أوم','الطاقات الميكانيكية','موجة متوالية'],observe:'توقع قبل التجربة',tasks:['مع ثبات المقاومة، ماذا يحدث لشدة التيار إذا ضاعفنا التوتر؟ تحقق ثم فسّر باستعمال I = U/R.','ضاعف السرعة. بكم تتضاعف الطاقة الحركية؟ قارن كذلك أثر تغيير الارتفاع.','ارفع التردد مع تثبيت سرعة الانتشار. ماذا يحدث لطول الموجة؟ لاحظ أن نقط الوسط تهتز في مكانها ولا تنتقل مع الموجة.'],pause:'إيقاف / متابعة',reset:'إعادة الضبط',labels:['التوتر U (V)','المقاومة R (Ω)','الكتلة m (kg)','السرعة v (m/s)','الارتفاع h (m)','السعة A (m)','التردد f (Hz)','سرعة الانتشار c (m/s)']}};
let lang=localStorage.getItem('lab-language')||'fr',mode=0,playing=true,time=0,last=0;
const defaults=[[6,10],[2,3,2],[.3,1,3]],limits=[[[0,12,.1],[1,100,1]],[[.1,10,.1],[0,10,.1],[0,10,.1]],[[.05,.8,.05],[.2,3,.1],[1,8,.1]]];let values=defaults.map(x=>x.slice());
const ids=['u','r','m','v','h','a','f','c'];const offsets=[0,2,5];const el=id=>document.getElementById(id);const ctx=el('plot').getContext('2d');
function renderUI(){const t=translations[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';el('title').textContent=t.title;el('subtitle').textContent=t.subtitle;el('observe').textContent=t.observe;el('task').textContent=t.tasks[mode];el('pause').textContent=t.pause;el('reset').textContent=t.reset;el('tabs').replaceChildren();t.tabs.forEach((name,i)=>{const b=document.createElement('button');b.textContent=name;b.className=mode===i?'active':'';b.onclick=()=>{mode=i;renderUI();draw()};el('tabs').append(b)});el('controls').replaceChildren();limits[mode].forEach((range,i)=>{const wrap=document.createElement('label'),name=document.createElement('span'),input=document.createElement('input');name.textContent=t.labels[offsets[mode]+i]+' : '+values[mode][i];input.type='range';[input.min,input.max,input.step]=range;input.value=values[mode][i];input.id=ids[offsets[mode]+i];input.oninput=()=>{values[mode][i]=Number(input.value);name.textContent=t.labels[offsets[mode]+i]+' : '+input.value;draw()};wrap.append(name,input);el('controls').append(wrap)})}
function fit(){const c=el('plot'),rect=c.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(rect.width*dpr);c.height=Math.round(rect.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);return [rect.width,rect.height]}
function axes(w,h){ctx.clearRect(0,0,w,h);ctx.strokeStyle='#c3d6dd';ctx.lineWidth=1;for(let x=40;x<w-20;x+=40){ctx.beginPath();ctx.moveTo(x,20);ctx.lineTo(x,h-30);ctx.stroke()}for(let y=30;y<h-20;y+=40){ctx.beginPath();ctx.moveTo(40,y);ctx.lineTo(w-15,y);ctx.stroke()}ctx.fillStyle='#355a6a';ctx.font='14px Arial'}
function draw(){const [w,h]=fit();axes(w,h);const a=values[mode];if(mode===0){const [u,r]=a,i=u/r;el('metric').textContent='I = '+i.toFixed(3)+' A • P = '+(u*i).toFixed(2)+' W';el('formula').textContent='I = U/R • P = U I. '+(lang==='ar'?'نموذج مقاومة أومية عند درجة حرارة ثابتة.':'Conducteur ohmique à température constante.');const maxI=12/r;ctx.strokeStyle='#098681';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(40,h-35);ctx.lineTo(w-25,30);ctx.stroke();const px=40+(w-65)*u/12,py=h-35-(h-65)*i/maxI;ctx.fillStyle='#e68d3b';ctx.beginPath();ctx.arc(px,py,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#355a6a';ctx.fillText('U (V)',w-65,h-10);ctx.fillText('I (A)',10,20)}else if(mode===1){const [m,v,z]=a,ec=.5*m*v*v,ep=m*9.81*z,em=ec+ep;el('metric').textContent='Ec = '+ec.toFixed(1)+' J • Epp = '+ep.toFixed(1)+' J • Em = '+em.toFixed(1)+' J';el('formula').textContent='Ec = ½ m v² • Epp = m g h • g = 9.81 N/kg. '+(lang==='ar'?'مرجع طاقة الوضع عند h = 0. القيم أمثلة مستقلة وليست حركة محفوظة الطاقة.':'Référence de l’énergie potentielle : h = 0. Les paramètres sont indépendants, pas une trajectoire à énergie conservée.');const max=Math.max(em,1);[ec,ep,em].forEach((e,i)=>{const bw=(w-100)/4,x=55+i*(w-70)/3,bh=e/max*(h-85);ctx.fillStyle=['#098681','#e68d3b','#416d9a'][i];ctx.fillRect(x,h-45-bh,bw,bh);ctx.fillStyle='#355a6a';ctx.fillText(['Ec','Epp','Em'][i],x,h-20)})}else{const [amp,f,c]=a,lambda=c/f;el('metric').textContent='λ = '+lambda.toFixed(2)+' m • T = '+(1/f).toFixed(2)+' s';el('formula').textContent='y(x,t) = A sin(2π(ft − x/λ)) • λ = c/f. '+(lang==='ar'?'موجة جيبية مستمرة تنتشر نحو +x. نقط الوسط تهتز عرضياً.':'Onde sinusoïdale continue vers +x ; oscillation transversale du milieu.');const world=10,mid=h/2;ctx.strokeStyle='#098681';ctx.lineWidth=3;ctx.beginPath();for(let px=40;px<w-15;px++){const x=(px-40)/(w-55)*world,y=mid-amp*Math.sin(2*Math.PI*(f*time-x/lambda))*100;if(px===40)ctx.moveTo(px,y);else ctx.lineTo(px,y)}ctx.stroke();for(let n=0;n<=20;n++){const x=n/2,px=40+x/world*(w-55),py=mid-amp*Math.sin(2*Math.PI*(f*time-x/lambda))*100;ctx.fillStyle=n===8?'#e68d3b':'#416d9a';ctx.beginPath();ctx.arc(px,py,n===8?7:3,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#355a6a';ctx.fillText('x (m) →',w-80,h-15)}}
el('language').onclick=()=>{lang=lang==='fr'?'ar':'fr';localStorage.setItem('lab-language',lang);renderUI();draw()};el('pause').onclick=()=>playing=!playing;el('reset').onclick=()=>{values=defaults.map(x=>x.slice());time=0;renderUI();draw()};window.addEventListener('resize',draw);document.addEventListener('visibilitychange',()=>{last=0});function frame(now){if(last&&playing&&!document.hidden)time+=Math.min((now-last)/1000,.05);last=now;if(mode===2)draw();requestAnimationFrame(frame)}renderUI();draw();requestAnimationFrame(frame);
</script></body></html>
